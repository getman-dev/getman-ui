name: Bug Report
description: Something is broken or behaves incorrectly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we reproduce the issue?
      placeholder: |
        1. Load a spec (URL or file upload)
        2. Navigate to '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, stack traces, or screenshots if applicable.
    validations:
      required: true

  - type: textarea
    id: spec_details
    attributes:
      label: Spec details
      description: >
        Does the bug reproduce with any OpenAPI 3.x spec, or only specific ones?
        Can you share a minimal spec that reproduces the issue? (strip any sensitive data)
      placeholder: |
        - Reproduces with: any spec / specific spec only
        - Involves: $ref / oneOf / anyOf / allOf / securitySchemes / server variables / other
        - Minimal spec snippet (if helpful):

  - type: dropdown
    id: embed_method
    attributes:
      label: Embed method
      options:
        - CDN via jsDelivr
        - mountApiExplorer in own bundle
        - Dev server (npm run dev)
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Chrome 124, Firefox 125, Safari 17"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. macOS 14, Ubuntu 22.04, Windows 11"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. v1.2.0 or git SHA"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Console errors, network logs, or anything else that helps reproduce the issue.