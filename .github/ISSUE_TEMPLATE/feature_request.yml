name: Feature Request
description: Propose a new capability or user-visible improvement
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >
        What problem does this solve? Why is the current behavior insufficient?
        If you're migrating from Swagger UI or Redoc, describe what you relied on there.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear description of what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: spec_area
    attributes:
      label: OpenAPI spec area
      description: Which part of the OpenAPI 3.x spec does this relate to?
      multiple: true
      options:
        - Request body
        - Response schema rendering
        - $ref resolution
        - oneOf / anyOf / allOf
        - securitySchemes / auth
        - Server variables
        - Parameters (path / query / header / cookie)
        - Examples
        - Links / callbacks
        - Not spec-specific (UI / UX / embed)

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why you ruled them out.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links to the OpenAPI spec, prior art in Swagger UI / Redoc, or related issues.