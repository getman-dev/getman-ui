<!doctype html>
<html lang="en" class="bg-gray-50 dark:bg-gray-900">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>API Explorer — Spec Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['IBM Plex Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-50 font-sans px-6 py-12 pb-20">

<!-- Header -->
<div class="max-w-4xl mx-auto mb-12 flex items-center gap-4">
  <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center shrink-0">
    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="1.5"/>
    </svg>
  </div>
  <div>
    <h1 class="text-lg font-semibold tracking-tight leading-tight">API Explorer — Spec Catalog</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">OpenAPI 3.1 feature showcase specs. Click any card to
      open in the explorer.</p>
  </div>
</div>

<!-- Grid -->
<div class="max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-4" id="grid"></div>

<script>
  const SWAGGER_UI_URL = 'swagger.html';
  const SCALAR_URL = 'scalar.html';

  const specs = [
    {
      file: "blog-api.json",
      title: "Blog API",
      color: "#3b82f6",
      desc: "Full CRUD operations across posts, comments, and users. Covers GET, POST, PUT, PATCH, DELETE with pagination, multiple tags, reusable component schemas, parameters, and shared error responses.",
      tags: ["CRUD", "pagination", "$ref", "tags", "responses"],
      meta: "3 tags · 11 endpoints",
    },
    {
      file: "auth-all-schemes.json",
      title: "Auth Showcase",
      color: "#f59e0b",
      desc: "Every OpenAPI security scheme type: API Key (header, query, cookie), HTTP Basic and Bearer, all four OAuth 2.0 flows, and OpenID Connect. Also shows AND/OR combinations and public endpoint override.",
      tags: ["apiKey", "OAuth2", "Bearer", "OIDC", "security"],
      meta: "4 tags · 13 endpoints",
    },
    {
      file: "parameters-all-types.json",
      title: "Parameters Showcase",
      color: "#8b5cf6",
      desc: "All four parameter locations (path, query, header, cookie) and every serialization style: simple, label, matrix, form, spaceDelimited, pipeDelimited, deepObject. Also covers explode, allowReserved, deprecated params, and schema constraints.",
      tags: ["path", "query", "header", "cookie", "styles", "explode"],
      meta: "5 tags · 11 endpoints",
    },
    {
      file: "schemas-complex-types.json",
      title: "Schema Types Showcase",
      color: "#10b981",
      desc: "The full JSON Schema composition toolkit: allOf, anyOf, oneOf, not, discriminator-based polymorphism, recursive $ref (tree nodes), all string formats, nullable fields (3.1 style), enums, const, readOnly, writeOnly.",
      tags: ["allOf", "oneOf", "discriminator", "nullable", "formats", "recursive"],
      meta: "4 tags · 10 endpoints",
    },
    {
      file: "file-upload-download.json",
      title: "File Upload & Download",
      color: "#f43f5e",
      desc: "Single and multi-file multipart/form-data uploads, the encoding object with custom per-part headers, raw octet-stream binary upload and download, inline browser preview with content negotiation.",
      tags: ["multipart", "octet-stream", "base64", "encoding", "binary"],
      meta: "3 tags · 9 endpoints",
    },
    {
      file: "response-codes-headers.json",
      title: "Response Codes & Headers",
      color: "#06b6d4",
      desc: "The full HTTP status code range: 200, 201, 202, 204, 206, 301, 302, 304, 400, 401, 429, 503, plus wildcard ranges (2XX, 4XX, 5XX). Demonstrates caching, rate-limit, pagination, and Set-Cookie headers.",
      tags: ["2XX", "4XX", "5XX", "headers", "links", "Set-Cookie"],
      meta: "5 tags · 13 endpoints",
    },
    {
      file: "callbacks-webhooks.json",
      title: "Callbacks & Webhooks",
      color: "#ec4899",
      desc: "OpenAPI callbacks on async operations (subscription events, payment results, export jobs) and OpenAPI 3.1 top-level webhooks. Covers HMAC signature headers, delivery retry semantics, and event envelope schemas.",
      tags: ["callbacks", "webhooks", "async", "events", "3.1"],
      meta: "3 tags · 6 endpoints · 3 webhooks",
    },
    {
      file: "servers-and-variables.json",
      title: "Servers & Variables",
      color: "#64748b",
      desc: "Multiple global server objects with URL template variables, path-level server override (CDN and internal network), and operation-level override (compute cluster for reports, dedicated upload server).",
      tags: ["servers", "variables", "path-override", "operation-override"],
      meta: "3 tags · 8 endpoints",
    },
  ];

  const grid = document.getElementById("grid");

  for (const spec of specs) {
    const explorerHref = `/?url=/specs/${spec.file}`;
    const swaggerHref = `${SWAGGER_UI_URL}?url=/specs/${spec.file}`;
    const scalarHref = `${SCALAR_URL}?url=/specs/${spec.file}`;

    const card = document.createElement("div");
    card.className = [
      "bg-white dark:bg-gray-800",
      "border border-gray-200 dark:border-gray-700",
      "rounded-xl p-5",
      "flex flex-col gap-3",
      "transition-all duration-150",
      "hover:border-blue-500 dark:hover:border-blue-400",
      "hover:shadow-[0_0_0_3px_rgba(59,130,246,0.12)]",
    ].join(" ");

    card.innerHTML = `
        <!-- Card header -->
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-start gap-2 flex-1 min-w-0">
            <span class="mt-1.5 w-2 h-2 rounded-full shrink-0" style="background:${spec.color}"></span>
            <div class="min-w-0">
              <div class="font-mono text-[10px] text-gray-400 dark:text-gray-500 mb-0.5 truncate">${spec.file}</div>
              <div class="text-sm font-semibold tracking-tight leading-snug">${spec.title}</div>
            </div>
          </div>
        </div>

        <!-- Description -->
        <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">${spec.desc}</p>

        <!-- Tags -->
        <div class="flex flex-wrap gap-1">
          ${spec.tags.map(t => `
            <span class="text-[10px] font-mono bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 rounded px-1.5 py-0.5 whitespace-nowrap">${t}</span>
          `).join("")}
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-700">
          <span class="text-[10px] font-mono text-gray-400 dark:text-gray-500">${spec.meta}</span>
          <div class="flex items-center gap-2">

            <!-- Open in Explorer -->
            <a href="${explorerHref}"
               class="inline-flex items-center gap-1 text-[11px] font-medium text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-950 hover:opacity-80 transition-opacity rounded-md px-2.5 py-1">
              Open in Explorer
              <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </a>

            <!-- Open with Swagger -->
            <a href="${swaggerHref}"
               target="_blank"
               rel="noopener noreferrer"
               class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950 hover:opacity-80 transition-opacity rounded-md px-2.5 py-1">
              Swagger UI
              <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </a>

            <!-- Open with Scalar -->
            <a href="${scalarHref}"
               target="_blank"
               rel="noopener noreferrer"
               class="inline-flex items-center gap-1 text-[11px] font-medium text-violet-700 dark:text-violet-300 bg-violet-50 dark:bg-violet-950 hover:opacity-80 transition-opacity rounded-md px-2.5 py-1">
              Scalar
              <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </a>

          </div>
        </div>
      `;

    grid.appendChild(card);
  }
</script>

</body>
</html>
