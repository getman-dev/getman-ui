<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Swagger UI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" rel="stylesheet"/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            /*background: #0f1117;*/
            color: #e2e8f0;
            min-height: 100vh;
        }

        #error-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
            padding: 32px;
            text-align: center;
        }

        #error-screen.visible {
            display: flex;
        }

        #error-screen .icon {
            font-size: 48px;
        }

        #error-screen h1 {
            font-size: 1.5rem;
            color: #f87171;
        }

        #error-screen p {
            color: #94a3b8;
            max-width: 480px;
            line-height: 1.6;
        }

        #error-screen code {
            background: #1e2533;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #7dd3fc;
        }

        #swagger-ui-container {
            display: none;
        }

        #swagger-ui-container.visible {
            display: block;
        }

        /* Override Swagger UI styles to match dark surroundings at the topbar */
        .swagger-ui .topbar {
            background: #161b27;
            border-bottom: 1px solid #2d3748;
            padding: 8px 0;
        }

        .swagger-ui .topbar .download-url-wrapper {
            display: none !important;
        }

        .swagger-ui .topbar-wrapper img {
            display: none;
        }

        .swagger-ui .topbar-wrapper a::after {
            content: '⚡ API Explorer';
            color: #7dd3fc;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<div id="error-screen">
    <div class="icon">🔌</div>
    <h1>No API URL provided</h1>
    <p>
        Pass an OpenAPI spec URL via the <code>url</code> query parameter.<br/><br/>
        Example:<br/>
        <code>swagger-ui.html?url=https://example.com/openapi.json</code>
    </p>
</div>

<div id="swagger-ui-container">
    <div id="swagger-ui"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const apiUrl = params.get('url');

        if (!apiUrl) {
            document.getElementById('error-screen').classList.add('visible');
            return;
        }

        document.getElementById('swagger-ui-container').classList.add('visible');
        document.title = 'Swagger UI — ' + apiUrl;

        SwaggerUIBundle({
            url: apiUrl,
            dom_id: '#swagger-ui',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: 'StandaloneLayout',
            deepLinking: true,
            showExtensions: true,
            showCommonExtensions: true,
            tryItOutEnabled: true,
            requestSnippetsEnabled: true,
        });
    })();
</script>
</body>
</html>
